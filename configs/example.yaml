# Example telefacet configuration. Mirrors the schema accepted by the
# original telefacet-web client (ConfigLoader.js).

servers:
  - address: ws://localhost:9001
  # - address: ws://192.168.1.101:9001

camera_config:
  width: 1456
  height: 1088
  crop_width: 1456
  crop_height: 1088
  crop_left: 0
  crop_top: 0
  v4l2_buffers: 4

frame_saving:
  mode: none                  # none | buffer | batch | checkerboard
  output_dir: camera_frames
  prepend_timestamp_to_dir: false
  batch_size: 10
  writer_threads: 4
  # checkerboard mode only:
  checkerboard_rows: 8
  checkerboard_cols: 11
  checkerboard_full_res_detection: false
  checkerboard_num_threads: 4

# Per-global-camera AWB gains. Keys are cam0, cam1, ... matching global ids
# assigned in (server_index, local_camera_id) sort order.
awb_gains:
  cam0: { r: 1.5, g: 1.0, b: 1.8 }
  # cam1: { r: 1.6, g: 1.0, b: 1.7 }
