# Example telefacet configuration (protocol v5).

servers:
  - address: ws://localhost:9001
  # - address: ws://192.168.1.101:9001

camera_config:
  width: 1456
  height: 1088
  crop_width: 1456
  crop_height: 1088
  crop_left: 0
  crop_top: 0
  v4l2_buffers: 4

frame_saving:
  mode: none                  # none | buffer | batch | checkerboard
  output_dir: camera_frames
  prepend_timestamp_to_dir: false
  batch_size: 10
  writer_threads: 4
  # checkerboard mode only:
  checkerboard_rows: 8
  checkerboard_cols: 11
  checkerboard_full_res_detection: false
  checkerboard_num_threads: 4

# awb_gains is not used in v2; AWB is applied by the ISP hardware.
